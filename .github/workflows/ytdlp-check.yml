name: Scheduled yt-dlp Compatibility & Health Check

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-health:
    name: Test yt-dlp Extraction & Upstream Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Extraction Health Probe
        id: probe
        run: node scripts/test-ytdlp-health.js

      - name: Open GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 [CRITICAL] Scheduled yt-dlp extraction failure detected',
              body: `The scheduled yt-dlp extraction health test failed on ${new Date().toISOString()}.\n\nThis usually indicates that YouTube or an upstream provider modified their video player signatures or bot protection.\n\nWorkflow logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated-alert']
            });
