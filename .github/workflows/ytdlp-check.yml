name: Scheduled yt-dlp Compatibility & Health Check

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-health:
    name: Test yt-dlp Extraction & Upstream Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Extraction Health Probe
        id: probe
        run: node scripts/test-ytdlp-health.js

      - name: Write Diagnostic Summary on Failure
        if: failure()
        run: |
          echo "## 🚨 Scheduled yt-dlp Health Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "A media extraction failure was detected at $(date -u)." >> $GITHUB_STEP_SUMMARY
          echo "This typically indicates YouTube or an upstream provider updated their video signatures or bot challenge algorithms." >> $GITHUB_STEP_SUMMARY
          echo "GitHub Actions automatically sends a private failure notification email to the repository owner." >> $GITHUB_STEP_SUMMARY
