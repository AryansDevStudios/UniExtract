name: Build & Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0 - leave empty to use package.json version)'
        required: false
        default: ''
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install --prefix client

      - name: Build Client & Sync Dist
        run: npm run client:build

      - name: Build Windows Executables (NSIS & Portable)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist-electron/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist-electron/checksums-sha256.txt -Append -Encoding ascii
          }
          Write-Host "Generated SHA-256 Checksums:"
          Get-Content dist-electron/checksums-sha256.txt

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.tag_name }}") {
            $tag = "${{ github.event.inputs.tag_name }}"
          } elseif ($env:GITHUB_REF -match "refs/tags/(.*)") {
            $tag = $Matches[1]
          } else {
            $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$pkgVersion"
          }
          Write-Host "Active Release Tag: $tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Universal Media Extractor ${{ steps.get_tag.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            dist-electron/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
